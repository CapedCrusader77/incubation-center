<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launchpad — Innovation & Startup Incubation Center</title>
  <meta name="description" content="University Innovation & Startup Incubation Management System — venture tracking, capital, mentorship, IP and performance metrics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <!-- Mobile Header -->
    <div class="mobile-bar">
      <button type="button" id="mobile-menu-btn" class="icon-btn" aria-label="Toggle Navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="mobile-brand">
        <span class="brand-glyph">✦</span>
        <span>LAUNCHPAD</span>
      </div>
      <button type="button" id="mobile-theme-btn" class="icon-btn theme-toggle-btn" aria-label="Toggle Theme">
        <span class="theme-icon">◐</span>
      </button>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <span class="brand-glyph">✦</span>
        </div>
        <div class="brand-info">
          <span class="brand-name">LAUNCHPAD</span>
          <span class="brand-tag">INCUBATION CENTER</span>
        </div>
      </div>

      <div class="side-search-wrap">
        <button type="button" class="quick-search-trigger" id="quick-search-trigger" title="Press Ctrl+K to search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search or jump…</span>
          <kbd class="kbd-shortcut">Ctrl K</kbd>
        </button>
      </div>

      <div class="side-label">WORKSPACE</div>
      <nav id="nav">
        <button data-view="overview" class="active">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Overview</span>
        </button>
        <button data-view="startups">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>Startups</span>
        </button>
        <button data-view="people">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>People & Mentors</span>
        </button>
        <button data-view="funding">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 6v12"/></svg>
          <span>Funding & Pitches</span>
        </button>
        <button data-view="programs">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          <span>Events & Programs</span>
        </button>
        <button data-view="research">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
          <span>IP & Grants</span>
        </button>
        <button data-view="reports">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span>Executive Reports</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="db-status-row">
          <span class="status-pulse-dot" id="db-status-dot"></span>
          <span id="db-status">Connecting to database…</span>
        </div>
        <div class="theme-bar">
          <button type="button" id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark / Light Theme">
            <span class="theme-icon">◑</span>
            <span class="theme-text">Switch appearance</span>
          </button>
        </div>
        <small class="sys-version">MANAGED REPOSITORY · DBMS</small>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb" id="breadcrumb">
            <span class="breadcrumb-root">INCUBATION PORTAL</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="breadcrumb-current">Overview</span>
          </div>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="top-actions">
          <div class="time-badge" id="live-time-badge">
            <span class="live-dot"></span>
            <span id="time-display">LIVE OPS</span>
          </div>
          <button type="button" id="top-quick-action" class="outline mini-hide" title="Quick Actions">
            <span>⚡ Quick Action</span>
          </button>
          <button id="top-create" class="primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>New startup</span>
          </button>
        </div>
      </header>

      <!-- Toast / System Notice -->
      <div id="notice" role="status" aria-live="polite"></div>

      <!-- Main Dynamic Content -->
      <div id="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading incubator workspace…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Record Creation / Update Modal -->
  <dialog id="modal">
    <div class="modal-wrapper">
      <form id="record-form">
        <div class="modal-head">
          <div>
            <span class="modal-eyebrow">INCUBATION DATABASE</span>
            <h2 id="modal-title">Add record</h2>
          </div>
          <button type="button" id="close-modal" class="icon-button" aria-label="Close dialog">✕</button>
        </div>
        <div id="form-fields"></div>
        <div class="modal-actions">
          <button type="button" id="cancel-modal" class="ghost">Cancel</button>
          <button type="submit" id="save-modal-btn" class="primary">Save record →</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Quick Action & Command Palette Modal -->
  <dialog id="command-modal">
    <div class="cmd-palette-wrapper">
      <div class="cmd-palette-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="cmd-input" placeholder="Type a command, startup name, or view…" autocomplete="off" spellcheck="false">
        <kbd class="kbd-badge">ESC</kbd>
      </div>
      <div class="cmd-results" id="cmd-results">
        <!-- populated dynamically -->
      </div>
      <div class="cmd-footer">
        <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
        <span><kbd>↵</kbd> to select</span>
        <span><kbd>ESC</kbd> to close</span>
      </div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
